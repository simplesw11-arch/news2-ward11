<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7c8c">
<link rel="apple-touch-icon" href="icon-192.png?v=sw11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ประเมินผู้ป่วย">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<title>ตั้งค่า (สำหรับผู้ดูแล)</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef4f8;--card:#ffffff;--ink:#16324f;--mute:#62758a;--line:#dbe6ee;--teal:#0f7c8c;--tealSoft:#e3f3f5;
--s0:#2f9e6a;--s1:#f4c430;--s2:#f08a3c;--s3:#e0485a}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,"Noto Sans Thai",system-ui,sans-serif;font-size:17px;padding-bottom:env(safe-area-inset-bottom,0px)}
.head{background:linear-gradient(135deg,#0f7c8c,#1b5e8f);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 46px}
.head .in{max-width:1100px;margin:0 auto}
.head h1{font-family:Prompt,Sarabun,sans-serif;font-size:1.5rem;margin:0}
.head p{margin:4px 0 0;opacity:.85;font-size:.92rem}
.head a{color:#fff}
.wrap{max-width:1100px;margin:-32px auto 0;padding:0 14px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(22,50,79,.07)}
h2{font-family:Prompt,Sarabun,sans-serif;font-size:1.05rem;margin:0 0 12px;font-weight:600}
.f{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.f label{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mute)}
.f .go{grid-column:1/-1}
@media (min-width:760px){.f{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.f .go{grid-column:auto}}
input{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);background:#fff;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--teal)}
button{font:inherit;font-family:Prompt,Sarabun,sans-serif;font-weight:600;padding:11px 18px;border-radius:12px;border:none;cursor:pointer}
.go{background:var(--teal);color:#fff;align-self:end}
.dl{background:var(--tealSoft);color:var(--teal)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{padding:6px 12px;font-size:.85rem;background:var(--tealSoft);color:var(--teal);font-weight:500}
.msg{margin-top:10px;font-size:.92rem;color:var(--mute);min-height:1.2em}
.msg.err{color:#b3261e}
.tiles{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px rgba(22,50,79,.07)}
.tile .k{font-size:.85rem;color:var(--mute)}
.tile .v{font-family:Prompt,Sarabun,sans-serif;font-size:1.9rem;font-weight:700;line-height:1.2}
.tile .v small{font-size:.9rem;font-weight:500;color:var(--mute);margin-left:4px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-bottom:4px}
.bar .t b{font-weight:600}
.bar .t span{color:var(--mute);white-space:nowrap}
.track{height:12px;background:#f1f5f8;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--teal);min-width:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);padding-top:8px}
.col{flex:1;min-width:3px;background:var(--teal);border-radius:4px 4px 0 0;position:relative}
.col:hover{background:#0b5f6b}
.axis{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-top:4px}
.empty{color:var(--mute);font-size:.92rem}
.note{font-size:.82rem;color:var(--mute);margin:6px 0 0}
#out{display:none;flex-direction:column;gap:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem;white-space:nowrap}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);font-size:.8rem}
td:first-child,th:first-child{text-align:left}
tr.ed td{background:#f4fafb}
select{font:inherit;font-size:16px;padding:4px 2px;border:1.5px solid var(--teal);border-radius:8px;background:#fff;color:var(--ink)}
.eb{padding:6px 12px;font-size:.85rem;background:var(--tealSoft);color:var(--teal)}
.eb.sv{background:var(--teal);color:#fff}.eb.cc{background:#f1f5f8;color:var(--mute)}
.rk{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.8rem;font-weight:600;color:#fff}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f8;border-radius:14px;padding:5px;margin-bottom:14px}
.mode button{background:none;color:var(--mute);padding:9px 6px}
.mode button.on{background:var(--teal);color:#fff}
.hide{display:none!important}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:.85rem;padding:6px 10px;border-radius:8px;display:none;z-index:9;white-space:nowrap}
.tg{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:none}
.tg .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:var(--tealSoft)}
.tg .t{flex:1;min-width:0}.tg .t b{display:block;font-family:Prompt,Sarabun,sans-serif;font-weight:600}.tg .t small{color:var(--mute);font-size:.85rem}
.sw{position:relative;flex:none;width:52px;height:30px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#c9d4dd;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--teal)}.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.st{font-size:.82rem;font-weight:600;min-width:34px;text-align:right}
@media (max-width:420px){.tg .t small{display:none}.tg{gap:10px}.tg .ic{width:38px;height:38px;font-size:1.2rem}}
.row2{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row2 button{flex:1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="head"><div class="in">
<a class="home" href="./" style="color:#fff;text-decoration:none;font-size:.9rem;opacity:.9">← กลับหน้าหลัก</a>
<h1>ตั้งค่า (สำหรับผู้ดูแล)</h1>
<p>การตั้งค่ามีผลกับทุกเครื่องที่เปิดเว็บไซต์นี้</p>
</div></div>
<div class="wrap">
<div class="card" id="login">
<h2>เข้าสู่ระบบผู้ดูแล</h2>
<label style="display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mute)">รหัสผ่านผู้ดูแล<input id="pin" type="password" autocomplete="current-password"></label>
<div class="row2"><button class="go" id="enter" type="button">เข้าสู่ระบบ</button></div>
<div class="msg" id="lmsg"></div>
</div>
<div class="card hide" id="panel">
<h2>แบบประเมินที่แสดงในหน้าหลัก</h2>
<p class="note" style="margin:0 0 4px">ปิดเพื่อซ่อนการ์ดในหน้าหลัก ข้อมูลและหน้าแบบประเมินยังคงอยู่ สามารถเปิดกลับได้ทุกเมื่อ</p>
<div id="list"></div>
<div class="row2"><button class="dl" id="cancel" type="button">ยกเลิก</button><button class="go" id="save" type="button">บันทึก</button></div>
<div class="msg" id="smsg"></div>
</div>
<div class="card hide" id="out2" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<span class="note" style="margin:0">เข้าสู่ระบบอยู่ (จนกว่าจะปิดหน้าต่างเบราว์เซอร์)</span><button class="dl" id="logout" type="button">ออกจากระบบ</button>
</div>
</div>
<script>
const B="https://bouxgjkhlywhxmtuyvpp.supabase.co/rest/v1/rpc/",KEY="sb_publishable_UCUPBieE6U2zWezBdNU40w_51N8Llqy";
const $=id=>document.getElementById(id);
const rpc=(f,body)=>fetch(B+f,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(body||{})});
const TOOLS=[["news2","🩺","NEWS2 / PEWS","คะแนนเตือนภาวะวิกฤต"],["fall","🛏️","Fall Risk","ความเสี่ยงพลัดตกหกล้ม"],["adl","🧍","ADL","การทำกิจวัตรประจำวัน"],["report","📊","รายงานการใช้งาน","สถิติการใช้งาน NEWS2 และ PEWS"]];
let PIN=null,saved=[],NOPIN=false;
const msg=(id,t,err)=>{$(id).className="msg"+(err?" err":"");$(id).textContent=t};
function render(h){$("list").innerHTML=TOOLS.map(([k,ic,n,d])=>`<div class="tg"><div class="ic">${ic}</div><div class="t"><b>${n}</b><small>${d}</small></div><span class="st" id="st_${k}"></span><label class="sw"><input type="checkbox" data-k="${k}" ${h.includes(k)?"":"checked"} aria-label="แสดง ${n}"><span></span></label></div>`).join("");
document.querySelectorAll("#list input").forEach(i=>{i.onchange=upd});upd()}
function cur(){return[...document.querySelectorAll("#list input")].filter(i=>!i.checked).map(i=>i.dataset.k)}
function upd(){document.querySelectorAll("#list input").forEach(i=>{const s=$("st_"+i.dataset.k);s.textContent=i.checked?"แสดง":"ซ่อน";s.style.color=i.checked?"var(--teal)":"var(--mute)"});
const ch=JSON.stringify(cur().sort())!==JSON.stringify([...saved].sort());$("save").disabled=!ch;$("cancel").disabled=!ch;
if(cur().length===TOOLS.length)msg("smsg","คำเตือน: หากซ่อนทั้งหมด หน้าหลักจะไม่มีแบบประเมินให้เลือก",true);else if(ch)msg("smsg","มีการเปลี่ยนแปลงที่ยังไม่ได้บันทึก");else msg("smsg","")}
async function enter(p){msg("lmsg","กำลังตรวจสอบ…");$("enter").disabled=true;
try{const r=await rpc("check_admin_pin",{pin:p});if(!r.ok)throw r.status;const ok=await r.json();
if(ok!==true){msg("lmsg","รหัสผ่านไม่ถูกต้อง",true);try{sessionStorage.removeItem("w11_admin")}catch(e){}return}
PIN=p;try{sessionStorage.setItem("w11_admin",p)}catch(e){}
const g=await rpc("get_settings");const j=g.ok?await g.json():{};saved=(j&&j.hidden_tools)||[];
$("login").classList.add("hide");$("panel").classList.remove("hide");$("out2").classList.toggle("hide",NOPIN);render(saved)}
catch(e){msg("lmsg","ไม่สามารถเชื่อมต่อได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต ("+e+")",true)}finally{$("enter").disabled=false}}
$("enter").onclick=()=>{const p=$("pin").value;if(!p)return msg("lmsg","โปรดระบุรหัสผ่าน",true);enter(p)};
$("pin").onkeydown=e=>{if(e.key==="Enter")$("enter").click()};
$("cancel").onclick=()=>render(saved);
$("save").onclick=async()=>{const h=cur();$("save").disabled=true;msg("smsg","กำลังบันทึก…");
try{const r=await rpc("set_hidden_tools",{pin:PIN,hidden:h});if(!r.ok)throw r.status;const j=await r.json();saved=(j&&j.hidden_tools)||h;
try{localStorage.setItem("w11_hidden_tools",JSON.stringify(saved))}catch(e){}render(saved);msg("smsg","บันทึกเรียบร้อยแล้ว หน้าหลักทุกเครื่องจะแสดงตามนี้เมื่อเปิดครั้งถัดไป")}
catch(e){msg("smsg","ไม่สามารถบันทึกข้อมูลได้ โปรดลองอีกครั้ง",true);upd()}};
$("logout").onclick=()=>{try{sessionStorage.removeItem("w11_admin")}catch(e){}location.reload()};
// ถ้ายังไม่ได้ตั้งรหัสผ่าน (ฐานข้อมูลตอบ true กับรหัสว่าง) เข้าหน้าตั้งค่าได้ทันที
(async()=>{let p="";try{p=sessionStorage.getItem("w11_admin")||""}catch(e){}
try{const r=await rpc("check_admin_pin",{pin:p});if(r.status===404){$("login").innerHTML="<h2>ยังไม่ได้เปิดใช้งานหน้าตั้งค่า</h2><p class=\"note\" style=\"margin:0\">ผู้ดูแลระบบต้องติดตั้งการตั้งค่าในฐานข้อมูลก่อน (ไฟล์ supabase-settings.sql) จึงจะใช้งานหน้านี้ได้</p>";return}if(r.ok&&await r.json()===true){NOPIN=!p;return enter(p)}}catch(e){}
if(p)enter(p)})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
